<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPS Kaltara — Autentikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; }
:focus-visible { outline: 2px solid #0099CC; outline-offset: 2px; border-radius: 4px; }

/* ── Screen transitions ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideRight {
  from { opacity: 0; transform: translateX(-24px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── Micro-interactions ── */
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%       { transform: translateX(-6px); }
  40%       { transform: translateX(6px); }
  60%       { transform: translateX(-4px); }
  80%       { transform: translateX(4px); }
}
@keyframes popIn {
  0%   { opacity: 0; transform: scale(.8); }
  70%  { transform: scale(1.05); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes checkDraw {
  from { stroke-dashoffset: 40; opacity: 0; }
  to   { stroke-dashoffset: 0;  opacity: 1; }
}
@keyframes ringPop {
  0%   { transform: scale(0); opacity: 0; }
  60%  { transform: scale(1.15); opacity: .6; }
  100% { transform: scale(1); opacity: 1; }
}

/* ── Brand panel ── */
@keyframes barRise {
  from { transform: scaleY(0); }
  to   { transform: scaleY(1); }
}
@keyframes floatY {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-4px); }
}
@keyframes shimmerSlide {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

/* ── Staggered field entrance ── */
.field-0 { animation: fadeUp 380ms cubic-bezier(.22,.68,0,1.2) 60ms both; }
.field-1 { animation: fadeUp 380ms cubic-bezier(.22,.68,0,1.2) 130ms both; }
.field-2 { animation: fadeUp 380ms cubic-bezier(.22,.68,0,1.2) 200ms both; }
.field-3 { animation: fadeUp 380ms cubic-bezier(.22,.68,0,1.2) 270ms both; }
.field-4 { animation: fadeUp 380ms cubic-bezier(.22,.68,0,1.2) 340ms both; }

/* ── Utility ── */
.fade-up    { animation: fadeUp  400ms cubic-bezier(.22,.68,0,1.2) both; }
.fade-down  { animation: fadeDown 400ms cubic-bezier(.22,.68,0,1.2) both; }
.fade-in    { animation: fadeIn  300ms ease both; }
.shake      { animation: shake   400ms ease both; }
.pop-in     { animation: popIn   450ms cubic-bezier(.22,.68,0,1.3) both; }
.slide-right{ animation: slideRight 350ms cubic-bezier(.22,.68,0,1.2) both; }

/* ── Input focus ring ── */
.input-wrap input { transition: border-color 200ms ease, box-shadow 200ms ease; }

/* ── Bar chart entrance ── */
.chart-bar {
  transform-origin: bottom;
  animation: barRise 600ms cubic-bezier(.22,.68,0,1.2) both;
}

/* ── Stat card float ── */
.stat-float-0 { animation: floatY 4s ease-in-out 0s infinite; }
.stat-float-1 { animation: floatY 4s ease-in-out .8s infinite; }
.stat-float-2 { animation: floatY 4s ease-in-out 1.6s infinite; }

/* ── Success circle ── */
.success-ring { animation: ringPop 500ms cubic-bezier(.22,.68,0,1.3) 100ms both; }
.check-path {
  stroke-dasharray: 40;
  animation: checkDraw 500ms ease 400ms both;
}

/* ── Button shimmer on hover ── */
.btn-primary-anim {
  position: relative; overflow: hidden;
}
.btn-primary-anim::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
  background-size: 400px 100%;
  background-position: -400px 0;
  transition: none;
  pointer-events: none;
}
.btn-primary-anim:hover::after {
  animation: shimmerSlide 600ms ease forwards;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

/* ─── Design tokens ───────────────────────────────────── */
const T = {
  blue:       '#0099CC',
  blueLight:  '#e0f4fb',
  blueDark:   '#007aa3',
  navy:       '#1E3A5F',
  navyDeep:   '#152c48',
  orange:     '#F7941D',
  green:      '#5CB85C',
  red:        '#DC2626',
  redBg:      '#fef2f2',
  slate:      '#475569',
  muted:      '#6B7280',
  border:     '#e2e8f0',
  bg:         '#f4f7fb',
  white:      '#ffffff',
  fg:         '#111827',
};

/* ─── Shared atoms ────────────────────────────────────── */
const EyeIcon = ({ open }) => open
  ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>;

const CheckIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const AlertIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
const MailIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>;
const LockIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
const ArrowLeft = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
const ShieldIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;

function Field({ label, required, error, success, hint, children }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
      <label style={{ fontSize: 13.5, fontWeight: 600, color: T.fg }}>
        {label}{required && <span style={{ color: T.red, marginLeft: 2 }}>*</span>}
      </label>
      {children}
      {error && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: T.red }}>
          <AlertIcon />{error}
        </div>
      )}
      {success && !error && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: T.green }}>
          <CheckIcon />{success}
        </div>
      )}
      {hint && !error && !success && (
        <div style={{ fontSize: 12, color: T.muted }}>{hint}</div>
      )}
    </div>
  );
}

function Input({ icon, right, error, ...props }) {
  return (
    <div style={{ position: 'relative' }}>
      {icon && (
        <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: T.muted, display: 'flex', pointerEvents: 'none' }}>{icon}</span>
      )}
      <input
        {...props}
        style={{
          width: '100%', height: 44, borderRadius: 8,
          border: `1.5px solid ${error ? T.red : T.border}`,
          paddingLeft: icon ? 42 : 14,
          paddingRight: right ? 44 : 14,
          fontSize: 14, color: T.fg,
          background: error ? '#fff8f8' : T.white,
          outline: 'none', transition: 'border-color 150ms, box-shadow 150ms',
          ...props.style,
        }}
        onFocus={e => { e.target.style.borderColor = T.blue; e.target.style.boxShadow = `0 0 0 3px ${T.blueLight}`; }}
        onBlur={e => { e.target.style.borderColor = error ? T.red : T.border; e.target.style.boxShadow = 'none'; }}
      />
      {right && (
        <span style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', display: 'flex' }}>{right}</span>
      )}
    </div>
  );
}

function PrimaryBtn({ children, loading, ...props }) {
  return (
    <button {...props} style={{
      width: '100%', height: 46, borderRadius: 8,
      background: loading ? T.blueDark : T.blue, color: T.white,
      border: 'none', fontWeight: 700, fontSize: 15,
      cursor: loading ? 'not-allowed' : 'pointer',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
      transition: 'background 150ms, transform 100ms',
      ...props.style,
    }}
    onMouseEnter={e => { if (!loading) e.target.style.background = T.blueDark; }}
    onMouseLeave={e => { e.target.style.background = loading ? T.blueDark : T.blue; }}
    onMouseDown={e => { e.currentTarget.style.transform = 'scale(.98)'; }}
    onMouseUp={e => { e.currentTarget.style.transform = 'scale(1)'; }}
    disabled={loading}
    >
      {loading && <span style={{ width: 18, height: 18, border: '2.5px solid rgba(255,255,255,.3)', borderTopColor: '#fff', borderRadius: '50%', animation: 'spin .65s linear infinite', display: 'inline-block', flexShrink: 0 }}></span>}
      {children}
    </button>
  );
}

/* ─── Brand panel (left) ──────────────────────────────── */
function BrandPanel() {
  const stats = [
    { val: '728.498', label: 'Total Populasi', color: T.blue },
    { val: '6,78%',   label: 'Tingkat Kemiskinan', color: T.orange },
    { val: '48,2 Jt', label: 'PDRB Per Kapita', color: T.green },
  ];
  const bars = [45, 62, 58, 71, 68, 74, 70, 79, 82, 75, 88, 91];

  return (
    <div style={{
      width: 440, flexShrink: 0, background: T.navy,
      display: 'flex', flexDirection: 'column',
      padding: '40px 40px 36px',
      position: 'relative', overflow: 'hidden',
    }}>
      {/* Subtle bg grid */}
      <div style={{ position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(circle at 1px 1px, rgba(255,255,255,.04) 1px, transparent 0)', backgroundSize: '28px 28px', pointerEvents: 'none' }} />

      {/* Logo */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 48, position: 'relative' }}>
        <img src="../../../assets/bps-logo.png" alt="Logo BPS" style={{ width: 44, height: 44, objectFit: 'contain', filter: 'drop-shadow(0 2px 4px rgba(0,0,0,.4))' }} />
        <div>
          <div style={{ fontWeight: 700, fontSize: 16, color: T.white, lineHeight: 1.2 }}>BPS Kaltara</div>
          <div style={{ fontSize: 11.5, color: 'rgba(255,255,255,.55)', marginTop: 2 }}>Badan Pusat Statistik</div>
          <div style={{ fontSize: 11, color: 'rgba(255,255,255,.4)' }}>Provinsi Kalimantan Utara</div>
        </div>
      </div>

      {/* Headline */}
      <div style={{ position: 'relative', marginBottom: 32 }}>
        <div style={{ fontSize: 28, fontWeight: 700, color: T.white, lineHeight: 1.25, marginBottom: 12 }}>
          Sistem Informasi<br/>Statistik Daerah
        </div>
        <div style={{ fontSize: 14, color: 'rgba(255,255,255,.6)', lineHeight: 1.6 }}>
          Portal data resmi BPS Provinsi Kalimantan Utara — satu sumber kebenaran untuk seluruh data statistik daerah.
        </div>
      </div>

      {/* Mini stat cards */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 32 }}>
        {stats.map((s, i) => (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 12,
            background: 'rgba(255,255,255,.06)', borderRadius: 10,
            padding: '12px 14px', border: '1px solid rgba(255,255,255,.08)',
          }}>
            <div style={{ width: 4, height: 36, borderRadius: 2, background: s.color, flexShrink: 0 }} />
            <div>
              <div style={{ fontSize: 20, fontWeight: 700, color: T.white, fontFamily: "'IBM Plex Mono', monospace", lineHeight: 1 }}>{s.val}</div>
              <div style={{ fontSize: 11, color: 'rgba(255,255,255,.5)', marginTop: 3 }}>{s.label} · 2023</div>
            </div>
          </div>
        ))}
      </div>

      {/* Mini chart */}
      <div style={{ background: 'rgba(255,255,255,.04)', borderRadius: 10, padding: '14px 14px 10px', border: '1px solid rgba(255,255,255,.07)', marginTop: 'auto' }}>
        <div style={{ fontSize: 10.5, fontWeight: 600, color: 'rgba(255,255,255,.4)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 10 }}>PDRB Bulanan 2023</div>
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height: 44 }}>
          {bars.map((v, i) => (
            <div key={i} style={{ flex: 1, borderRadius: '2px 2px 0 0', background: i === bars.length - 1 ? T.blue : 'rgba(0,153,204,.35)', height: `${(v / 91) * 100}%`, transition: 'height 300ms' }} />
          ))}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 5 }}>
          {['Jan','','','Apr','','','Jul','','','Okt','','Des'].map((m, i) => (
            <div key={i} style={{ flex: 1, fontSize: 8.5, color: 'rgba(255,255,255,.3)', textAlign: 'center' }}>{m}</div>
          ))}
        </div>
      </div>

      {/* Bottom note */}
      <div style={{ marginTop: 20, fontSize: 11, color: 'rgba(255,255,255,.3)', display: 'flex', alignItems: 'center', gap: 6 }}>
        <ShieldIcon />
        Akses terbatas — hanya untuk pengguna terdaftar BPS Kaltara
      </div>
    </div>
  );
}

/* ─── Screen: Login ───────────────────────────────────── */
function LoginScreen({ onNavigate }) {
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [showPw, setShowPw] = React.useState(false);
  const [remember, setRemember] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [errors, setErrors] = React.useState({});
  const [attempt, setAttempt] = React.useState(0);

  const validate = () => {
    const e = {};
    if (!email) e.email = 'Alamat email wajib diisi';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = 'Format email tidak valid';
    if (!password) e.password = 'Kata sandi wajib diisi';
    else if (password.length < 6) e.password = 'Kata sandi minimal 6 karakter';
    return e;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setErrors({});
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      setAttempt(a => a + 1);
      if (email === 'admin@bps.go.id' && password === 'bpskaltara') {
        onNavigate('dashboard');
      } else {
        setErrors({ form: 'Email atau kata sandi tidak sesuai. Periksa kembali data Anda.' });
      }
    }, 1400);
  };

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', gap: 28, width: '100%', maxWidth: 380 }}>
      <div>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: T.fg, marginBottom: 6 }}>Masuk ke Akun</h1>
        <p style={{ fontSize: 14, color: T.muted, lineHeight: 1.6 }}>Gunakan akun resmi BPS Anda untuk mengakses portal statistik daerah.</p>
      </div>

      {/* Demo hint */}
      <div style={{ background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 8, padding: '10px 14px', fontSize: 12.5, color: '#92400e', display: 'flex', gap: 8 }}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{ flexShrink: 0, marginTop: 1 }}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span><strong>Demo:</strong> gunakan <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>admin@bps.go.id</span> / <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>bpskaltara</span></span>
      </div>

      {errors.form && (
        <div style={{ background: T.redBg, border: `1px solid #fecaca`, borderRadius: 8, padding: '12px 14px', fontSize: 13, color: T.red, display: 'flex', alignItems: 'flex-start', gap: 8 }}>
          <AlertIcon /><span>{errors.form}</span>
        </div>
      )}

      <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 18 }} noValidate>
        <Field label="Alamat Email" required error={errors.email}>
          <Input
            type="email" placeholder="nama@bps.go.id"
            value={email} onChange={e => { setEmail(e.target.value); setErrors(x => ({...x, email: null, form: null})); }}
            icon={<MailIcon />} error={errors.email}
            aria-required="true" aria-describedby={errors.email ? 'email-err' : undefined}
          />
        </Field>

        <Field label="Kata Sandi" required error={errors.password}>
          <Input
            type={showPw ? 'text' : 'password'} placeholder="Masukkan kata sandi"
            value={password} onChange={e => { setPassword(e.target.value); setErrors(x => ({...x, password: null, form: null})); }}
            icon={<LockIcon />} error={errors.password}
            aria-required="true"
            right={
              <button type="button" onClick={() => setShowPw(v => !v)}
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: T.muted, padding: 2, display: 'flex' }}
                aria-label={showPw ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'}>
                <EyeIcon open={showPw} />
              </button>
            }
          />
        </Field>

        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 13.5, color: T.slate }}>
            <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)}
              style={{ width: 16, height: 16, accentColor: T.blue, cursor: 'pointer' }} />
            Ingat saya
          </label>
          <button type="button" onClick={() => onNavigate('forgot')}
            style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 13.5, color: T.blue, fontWeight: 600, padding: 0 }}>
            Lupa kata sandi?
          </button>
        </div>

        <PrimaryBtn loading={loading} type="submit">
          {loading ? 'Memverifikasi...' : 'Masuk'}
        </PrimaryBtn>
      </form>

      <div style={{ fontSize: 12, color: T.muted, textAlign: 'center', lineHeight: 1.6, paddingTop: 8, borderTop: `1px solid ${T.border}` }}>
        Butuh akun? Hubungi administrator BPS Kaltara.<br/>
        <a href="#" style={{ color: T.blue, fontWeight: 600, textDecoration: 'none' }}>Hubungi Dukungan IT</a>
      </div>
    </div>
  );
}

/* ─── Screen: Forgot Password ─────────────────────────── */
function ForgotScreen({ onNavigate }) {
  const [email, setEmail] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError('Masukkan alamat email yang valid');
      return;
    }
    setError('');
    setLoading(true);
    setTimeout(() => { setLoading(false); onNavigate('email-sent', { email }); }, 1300);
  };

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', gap: 28, width: '100%', maxWidth: 380 }}>
      <button onClick={() => onNavigate('login')} style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', cursor: 'pointer', color: T.muted, fontSize: 13, padding: 0, width: 'fit-content' }}>
        <ArrowLeft />Kembali ke halaman masuk
      </button>

      <div>
        <div style={{ width: 48, height: 48, background: T.blueLight, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 16 }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={T.blue} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: T.fg, marginBottom: 8 }}>Lupa Kata Sandi?</h1>

/* ─── Screen: Reset Password ──────────────────────────── */
function ResetScreen({ onNavigate }) {
  const [pw, setPw] = React.useState('');
  const [confirm, setConfirm] = React.useState('');
  const [showPw, setShowPw] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [errors, setErrors] = React.useState({});

  const strength = pw.length === 0 ? 0 : pw.length < 6 ? 1 : pw.length < 10 ? 2 : /[A-Z]/.test(pw) && /[0-9]/.test(pw) ? 4 : 3;
  const strengthLabel = ['', 'Lemah', 'Cukup', 'Kuat', 'Sangat Kuat'][strength];
  const strengthColor = ['', T.red, T.orange, T.blue, T.green][strength];

  const handleSubmit = (e) => {
    e.preventDefault();
    const errs = {};
    if (pw.length < 8) errs.pw = 'Kata sandi minimal 8 karakter';
    if (pw !== confirm) errs.confirm = 'Kata sandi tidak cocok';
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); onNavigate('reset-success'); }, 1300);
  };

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', gap: 28, width: '100%', maxWidth: 380 }}>
      <div>
        <div style={{ width: 48, height: 48, background: T.blueLight, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 16 }}>
          <ShieldIcon />
        </div>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: T.fg, marginBottom: 8 }}>Buat Kata Sandi Baru</h1>
        <p style={{ fontSize: 14, color: T.muted, lineHeight: 1.6 }}>Kata sandi baru harus berbeda dari kata sandi sebelumnya dan memenuhi persyaratan keamanan.</p>
      </div>

      <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 18 }} noValidate>
        <Field label="Kata Sandi Baru" required error={errors.pw} hint="Minimal 8 karakter, kombinasi huruf dan angka">
          <Input
            type={showPw ? 'text' : 'password'} placeholder="Buat kata sandi baru"
            value={pw} onChange={e => { setPw(e.target.value); setErrors(x => ({...x, pw: null})); }}
            icon={<LockIcon />} error={errors.pw}
            right={
              <button type="button" onClick={() => setShowPw(v => !v)}
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: T.muted, padding: 2, display: 'flex' }}
                aria-label={showPw ? 'Sembunyikan' : 'Tampilkan'}>
                <EyeIcon open={showPw} />
              </button>
            }
          />
          {pw && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginTop: 2 }}>
              <div style={{ display: 'flex', gap: 4 }}>
                {[1,2,3,4].map(i => (
                  <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: strength >= i ? strengthColor : T.border, transition: 'background 250ms' }} />
                ))}
              </div>
              <div style={{ fontSize: 11.5, fontWeight: 600, color: strengthColor }}>{strengthLabel}</div>
            </div>
          )}
        </Field>

        <Field label="Konfirmasi Kata Sandi" required error={errors.confirm}
          success={confirm && pw === confirm && !errors.confirm ? 'Kata sandi cocok' : ''}>
          <Input
            type={showPw ? 'text' : 'password'} placeholder="Ulangi kata sandi baru"
            value={confirm} onChange={e => { setConfirm(e.target.value); setErrors(x => ({...x, confirm: null})); }}
            icon={<LockIcon />} error={errors.confirm}
          />
        </Field>

        <div style={{ background: T.bg, borderRadius: 8, padding: '10px 14px', fontSize: 12, color: T.muted, lineHeight: 1.7 }}>
          <strong>Persyaratan kata sandi:</strong>
          {[
            [pw.length >= 8, 'Minimal 8 karakter'],
            [/[A-Z]/.test(pw), 'Minimal 1 huruf kapital'],
            [/[0-9]/.test(pw), 'Minimal 1 angka'],
          ].map(([ok, txt], i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6, color: ok ? T.green : T.muted }}>
              {ok
                ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                : <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/></svg>
              }
              {txt}
            </div>
          ))}
        </div>

        <PrimaryBtn loading={loading} type="submit">
          {loading ? 'Menyimpan...' : 'Simpan Kata Sandi Baru'}
        </PrimaryBtn>
      </form>
    </div>
  );
}

/* ─── App shell ───────────────────────────────────────── */
function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('bps-auth-screen') || 'login');
  const [ctx, setCtx] = React.useState({});

  const navigate = (s, data = {}) => {
    setCtx(data);
    setScreen(s);
    localStorage.setItem('bps-auth-screen', s);
  };

  const renderScreen = () => {
    switch (screen) {
      case 'login':         return <LoginScreen onNavigate={navigate} />;
      case 'forgot':        return <ForgotScreen onNavigate={navigate} />;
      case 'email-sent':    return <EmailSentScreen email={ctx.email} onNavigate={navigate} />;
      case 'reset':         return <ResetScreen onNavigate={navigate} />;
      case 'reset-success': return <ResetSuccessScreen onNavigate={navigate} />;
      case 'dashboard':     return <DashboardRedirect onNavigate={navigate} />;
      default:              return <LoginScreen onNavigate={navigate} />;
    }
  };

  /* Screen nav tabs (demo helper) */
  const tabs = [
    { id: 'login',   label: 'Login' },
    { id: 'forgot',  label: 'Lupa Sandi' },
    { id: 'email-sent', label: 'Email Terkirim' },
    { id: 'reset',   label: 'Reset Sandi' },
    { id: 'reset-success', label: 'Berhasil' },
  ];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      {/* Demo nav */}
      <div style={{ background: T.navyDeep, display: 'flex', gap: 2, padding: '6px 12px', zIndex: 10, flexShrink: 0 }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => navigate(t.id)} style={{
            background: screen === t.id ? 'rgba(255,255,255,.15)' : 'transparent',
            border: 'none', borderRadius: 5, padding: '4px 10px',
            fontSize: 11.5, fontWeight: screen === t.id ? 700 : 400,
            color: screen === t.id ? '#fff' : 'rgba(255,255,255,.5)',
            cursor: 'pointer', transition: 'all 150ms', fontFamily: 'inherit',
          }}>{t.label}</button>
        ))}
        <div style={{ marginLeft: 'auto', fontSize: 11, color: 'rgba(255,255,255,.3)', display: 'flex', alignItems: 'center' }}>Navigasi Demo</div>
      </div>

      {/* Main layout */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        <BrandPanel />
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '32px 48px', background: T.white, overflowY: 'auto' }}>
          {renderScreen()}
        </div>
      </div>

      {/* Footer */}
      <div style={{ background: T.white, borderTop: `1px solid ${T.border}`, padding: '10px 24px', display: 'flex', justifyContent: 'space-between', fontSize: 11.5, color: T.muted, flexShrink: 0 }}>
        <span>© 2024 BPS Provinsi Kalimantan Utara</span>
        <span>v1.0.0 · Kebijakan Privasi · Syarat Penggunaan</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
