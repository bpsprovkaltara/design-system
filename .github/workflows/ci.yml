name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Selaras package.json engines (>=20) dan Dockerfile
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check use client directives
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' file; do
            if ! head -n 5 "$file" | grep -qE "^['\"]use client['\"]"; then
              echo "Missing 'use client': $file"
              missing=1
            fi
          done < <(
            find src/components/ui -type f \( -name '*.tsx' -o -name '*.ts' \) ! -name '*.test.*' -print0 |
              xargs -0 grep -lE 'useState|useEffect|useReducer|useEmblaCarousel' || true
          )
          if [ "$missing" -ne 0 ]; then
            echo "Client components that use hooks must start with 'use client'."
            exit 1
          fi

      - name: Test
        run: pnpm run test

      - name: Build library
        run: pnpm run build:lib

      - name: Build showcase
        run: pnpm run build
